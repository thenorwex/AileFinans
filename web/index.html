<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Aile Finans v24</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><h1>Aile Finans</h1><span id="status">Hazır</span></header>

<main id="app">
  <section class="tab active" data-page="home">
    <h2>Özet</h2>
    <div class="cards">
      <div class="card"><small>Toplam Hesap</small><b id="totalBalance">₺0</b></div>
      <div class="card"><small>Bu Ay Gider</small><b id="monthExpense">₺0</b></div>
      <div class="card"><small>Üyeler</small><b id="memberCount">0</b></div>
    </div>
    <div class="panel">
      <h3>Üyeler</h3><div id="homeMembers"></div>
    </div>
  </section>

  <section class="tab" data-page="expenses">
    <h2>Harcamalar</h2>
    <button class="primary" id="addExpense">+ Harcama</button>
    <div id="expenseList"></div>
  </section>

  <section class="tab" data-page="investments">
    <h2>Yatırımlar</h2>
    <button class="primary" id="addInvestment">+ Yatırım</button>
    <div id="investmentList"></div>
  </section>

  <section class="tab" data-page="reports">
    <h2>Raporlar</h2>
    <div class="panel"><div id="reportText"></div></div>
  </section>

  <section class="tab" data-page="more">
    <h2>Daha Fazla</h2>
    <button id="openMembers">Üye Yönetimi</button>
    <button id="openAccounts">Hesap / Kart Yönetimi</button>
    <button id="openVehicles">Araçlar</button>
    <button id="openBills">Faturalar</button>
  </section>
</main>

<nav class="bottom-nav" id="bottomNav">
  <button data-page="home" class="active">Ana Sayfa</button>
  <button data-page="expenses">Harcamalar</button>
  <button data-page="investments">Yatırımlar</button>
  <button data-page="reports">Raporlar</button>
  <button data-page="more">Daha Fazla</button>
</nav>

<div class="modal" id="memberModal" hidden>
  <div class="modalbox"><h3>Üye Ekle</h3>
    <form id="memberForm">
      <input id="memberName" required placeholder="Üye adı">
      <div class="row"><button type="button" data-close="memberModal">İptal</button><button class="primary" type="submit">Kaydet</button></div>
    </form>
  </div>
</div>

<div class="modal" id="accountModal" hidden>
  <div class="modalbox"><h3>Hesap / Kart Ekle</h3>
    <form id="accountForm">
      <input id="accountName" required placeholder="Hesap adı">
      <select id="accountType"><option>Banka</option><option>Nakit</option><option>Kredi Kartı</option><option>Diğer</option></select>
      <input id="accountBalance" type="number" step="0.01" placeholder="Bakiye">
      <select id="accountCurrency"><option value="TRY">TRY ₺</option><option value="USD">USD $</option><option value="EUR">EUR €</option><option value="GBP">GBP £</option></select>
      <div class="row"><button type="button" data-close="accountModal">İptal</button><button class="primary" type="submit">Kaydet</button></div>
    </form>
  </div>
</div>

<div class="modal" id="expenseEditModal" hidden>
  <div class="modalbox"><h3>Harcamayı Düzenle</h3>
    <form id="expenseEditForm">
      <input id="editExpenseTitle" required placeholder="Harcama açıklaması">
      <input id="editExpenseAmount" required type="number" step="0.01" min="0" placeholder="Tutar">
      <select id="editExpenseCurrency"><option value="TRY">TRY ₺</option><option value="USD">USD $</option><option value="EUR">EUR €</option><option value="GBP">GBP £</option></select>
      <select id="editExpenseMember"></select>
      <select id="editExpenseCategory"></select>
      <select id="editExpenseAccount"></select>
      <input id="editExpenseDate" type="date">
      <textarea id="editExpenseNote" rows="3" placeholder="Not"></textarea>
      <div class="row"><button type="button" data-close="expenseEditModal">İptal</button><button class="primary" type="submit">Kaydet</button></div>
    </form>
  </div>
</div>

<div class="modal" id="accountEditModal" hidden>
  <div class="modalbox"><h3>Hesabı Düzenle</h3>
    <form id="accountEditForm">
      <input id="editAccountName" required placeholder="Hesap adı">
      <select id="editAccountType"><option>Banka</option><option>Nakit</option><option>Kredi Kartı</option><option>Diğer</option></select>
      <input id="editAccountBalance" type="number" step="0.01" placeholder="Bakiye">
      <select id="editAccountCurrency"><option value="TRY">TRY ₺</option><option value="USD">USD $</option><option value="EUR">EUR €</option><option value="GBP">GBP £</option></select>
      <div class="row"><button type="button" data-close="accountEditModal">İptal</button><button class="primary" type="submit">Kaydet</button></div>
    </form>
  </div>
</div>

<div class="modal" id="expenseModal" hidden>
  <div class="modalbox"><h3>Harcama Ekle</h3>
    <form id="expenseForm">
      <input id="expenseTitle" required placeholder="Harcama açıklaması">
      <input id="expenseAmount" required type="number" step="0.01" min="0" placeholder="Tutar">
      <select id="expenseCurrency"><option value="TRY">TRY ₺</option><option value="USD">USD $</option><option value="EUR">EUR €</option><option value="GBP">GBP £</option></select>
      <label>Üye</label><select id="expenseMember"></select>
      <label>Kategori</label><select id="expenseCategory"></select>
      <label>Ödeme hesabı</label><select id="expenseAccount"></select>
      <label>Tarih</label><input id="expenseDate" type="date">
      <textarea id="expenseNote" rows="3" placeholder="Not (isteğe bağlı)"></textarea>
      <div class="row"><button type="button" data-close="expenseModal">İptal</button><button class="primary" type="submit">Kaydet</button></div>
    </form>
  </div>
</div>

<div class="modal" id="listModal" hidden>
  <div class="modalbox"><h3 id="listTitle"></h3><div id="listBody"></div>
    <div class="row"><button data-close="listModal">Kapat</button><button class="primary" id="listAdd">+ Ekle</button></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
